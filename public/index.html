<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lienzo: inspiración para artistas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--fondo:#fff;--gris:#f1f0f4;--linea:#e1dfe8;--tinta:#1b1a22;--suave:#5f5c6b;--acento:#7c5cff;--radio:20px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--fondo);color:var(--tinta);font:1.05rem/1.5 "Karla",system-ui,sans-serif}
h1,h2,.logo{font-family:"Syne","Karla",sans-serif;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--acento);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Barra */
.barra{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:1.25rem;padding:.8rem clamp(1rem,3vw,2rem);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
.logo{font-size:1.6rem;font-weight:800;text-decoration:none;color:var(--tinta)}
.buscador{flex:1}
.buscador input{width:100%;padding:.75rem 1.2rem;border:2px solid transparent;border-radius:999px;background:var(--gris);font:inherit;color:var(--tinta)}
.buscador input:focus-visible{outline:none;border-color:var(--tinta);background:#fff}

/* Intro y filtros */
.intro{text-align:center;padding:3.5rem 1.25rem 1.5rem}
.intro h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:800;margin-bottom:.8rem}
.intro p{max-width:48ch;margin:0 auto 2rem;color:var(--suave);font-size:1.15rem}
.filtros{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem}
.filtros button{padding:.6rem 1.3rem;border-radius:999px;background:var(--gris);font-weight:700;transition:background .2s,color .2s}
.filtros button:hover{background:var(--linea)}
.filtros button[aria-pressed="true"]{background:var(--tinta);color:#fff}

/* Muro */
.muro{column-width:250px;column-gap:1.25rem;max-width:1400px;margin:0 auto;padding:1.5rem clamp(1rem,3vw,2rem) 4rem}
.pin{break-inside:avoid;margin-bottom:1.5rem}
.media{position:relative;border-radius:var(--radio);overflow:hidden;transition:transform .25s,box-shadow .25s}
.pin:hover .media{transform:translateY(-3px);box-shadow:0 14px 30px rgba(27,26,34,.18)}
.abrir{display:block;width:100%;height:100%;position:absolute;inset:0;z-index:1}
.guardar{position:absolute;top:.6rem;right:.6rem;z-index:3;width:2.4rem;height:2.4rem;border-radius:50%;background:rgba(255,255,255,.92);font-size:1.15rem;line-height:2.4rem;transition:transform .15s}
.guardar:hover{transform:scale(1.12)}
.guardar[aria-pressed="true"]{background:var(--tinta);color:#ff5d7a}
.info{padding:.7rem .3rem 0}
.info h2{font-size:1.1rem;font-weight:600;margin-bottom:.2rem}
.info h2 button{text-align:left;font:inherit}
.info h2 button:hover{text-decoration:underline}
.info p{font-size:.95rem;color:var(--suave)}
.etiqueta{display:inline-block;margin-top:.5rem;padding:.15rem .7rem;border-radius:999px;background:var(--gris);font-size:.8rem;font-weight:700}
.vacio{text-align:center;padding:3rem 1.25rem 5rem;color:var(--suave)}
.vacio[hidden]{display:none}

/* Muestras de paleta */
.muestras{display:flex;flex-direction:column;height:100%}
.muestras button{position:relative;z-index:2;flex:1;display:flex;align-items:flex-end;padding:.6rem;background:var(--c);width:100%;text-align:left;transition:flex .25s}
.muestras button:hover{flex:1.5}
.muestras b{padding:.15rem .6rem;border-radius:999px;background:rgba(255,255,255,.88);font-size:.8rem}

/* Arte en CSS */
.arte{position:absolute;inset:0}
.arte::before,.arte::after{content:"";position:absolute}
.a-surreal{background:radial-gradient(circle at 50% 36%,#fff6e5 0 10%,transparent 10.5%),radial-gradient(ellipse at 50% 100%,#2f2566 0 34%,transparent 34.5%),radial-gradient(ellipse at 20% 78%,#3d3380 0 14%,transparent 14.5%),linear-gradient(#6a6fd1,#f29cb0 60%,#ffd9a8)}
.a-verano{background:radial-gradient(circle at 50% 62%,#fff0b3 0 22%,transparent 23%),linear-gradient(#ffd27a,#ff8c5a 55%,#b9482f)}
.a-acuarela{background:radial-gradient(circle at 28% 28%,rgba(255,107,107,.75),transparent 42%),radial-gradient(circle at 72% 42%,rgba(34,193,195,.7),transparent 45%),radial-gradient(circle at 42% 78%,rgba(255,214,90,.8),transparent 45%),radial-gradient(circle at 80% 85%,rgba(150,110,255,.55),transparent 40%),#fffaf3}
.a-minimal{background:radial-gradient(circle at 36% 40%,#d9482b 0 20%,transparent 20.5%),linear-gradient(90deg,transparent 55%,#1b1a22 55% 57%,transparent 57%),#ece7df}
.a-cyber{background:radial-gradient(circle at 50% 100%,rgba(255,60,172,.55),transparent 55%),repeating-linear-gradient(115deg,rgba(34,224,255,.55) 0 2px,transparent 2px 26px),linear-gradient(#0b0720,#1a0f3d)}
.a-riso{background:radial-gradient(#ff48b0 28%,transparent 30%) 0 0/14px 14px,radial-gradient(#0078bf 28%,transparent 30%) 7px 7px/14px 14px,#fdf3e3;background-blend-mode:multiply}
.a-botanico{background:#f1f0e2}
.a-botanico::before{left:20%;bottom:10%;width:34%;height:58%;border-radius:0 100% 0 100%;background:linear-gradient(135deg,#3f7d58,#1f4d37);transform:rotate(-12deg)}
.a-botanico::after{right:16%;bottom:14%;width:28%;height:46%;border-radius:100% 0 100% 0;background:linear-gradient(135deg,#7fb069,#3f7d58);transform:rotate(14deg);box-shadow:-40px -30px 0 -6px #c75c6b}
.a-cozy{background:radial-gradient(circle at 50% 44%,#ffe8a3 0 14%,rgba(255,190,90,.5) 26%,transparent 52%),linear-gradient(#4b2e2a,#b0683f)}
.a-cozy::before{left:30%;top:24%;width:40%;height:40%;border:6px solid #2c1a17;border-radius:8px;background:rgba(255,224,140,.55)}
.a-pop{background:radial-gradient(#e63946 22%,transparent 24%) 0 0/12px 12px,#ffe14d}
.a-pop::before{left:18%;top:22%;width:64%;aspect-ratio:1;border-radius:50%;background:#2b6cff;border:6px solid #1b1a22;box-shadow:14px 14px 0 #1b1a22}
.a-collage{background:#f4ede1}
.a-collage::before{left:10%;top:12%;width:62%;height:38%;background:#e8505b;transform:rotate(-6deg);box-shadow:30px 120px 0 -10px #3b82a0}
.a-collage::after{right:8%;bottom:14%;width:56%;height:34%;background:#f4c95d;transform:rotate(5deg);clip-path:polygon(0 8%,100% 0,94% 100%,6% 92%)}
.a-bosque{background:linear-gradient(#d9e8df,#8fb09f 55%,#34554a)}
.a-bosque::before{left:0;right:0;bottom:0;height:62%;background:#1f3a31;clip-path:polygon(0 100%,0 40%,8% 70%,14% 15%,22% 70%,30% 30%,38% 75%,46% 10%,55% 72%,63% 28%,71% 74%,80% 18%,88% 70%,94% 36%,100% 60%,100% 100%)}
.a-nouveau{background:repeating-radial-gradient(circle at 50% 100%,#2f6f5e 0 3px,transparent 3px 24px),radial-gradient(circle at 50% 100%,#e5c76b,#e9dcae 70%)}
.a-nouveau::before{inset:8%;border:3px solid #8a6d1f;border-radius:40% 40% 12px 12px}
.a-carbon{background:radial-gradient(circle at 40% 50%,rgba(25,25,25,.8),transparent 55%),repeating-linear-gradient(115deg,rgba(30,30,30,.55) 0 2px,transparent 2px 9px),#eeeae4}
.a-retro{background:linear-gradient(#2b1055,#d4418e 62%,#ff9a62)}
.a-retro::before{left:20%;top:26%;width:60%;aspect-ratio:1;border-radius:50%;background:linear-gradient(#ffe27a,#ff7a6b)}
.a-retro::after{left:20%;top:26%;width:60%;aspect-ratio:1;border-radius:50%;background:repeating-linear-gradient(transparent 0 10px,#d4418e 10px 14px);-webkit-mask:linear-gradient(transparent 50%,#000 50%);mask:linear-gradient(transparent 50%,#000 50%)}

/* Detalle */
dialog{border:0;border-radius:24px;padding:0;width:min(920px,94vw);max-height:92vh;overflow:auto;color:var(--tinta)}
dialog::backdrop{background:rgba(20,18,30,.6)}
.detalle{display:grid;grid-template-columns:1.1fr 1fr}
.detalle .media{border-radius:0;aspect-ratio:auto;min-height:420px;transform:none!important;box-shadow:none!important}
.detalle .muestras{flex-direction:column}
.cuerpo{padding:2rem;display:flex;flex-direction:column;gap:.8rem}
.cuerpo h2{font-size:1.8rem;font-weight:800}
.cuerpo p{color:var(--suave)}
.cuerpo .fila{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:auto;padding-top:1rem}
.btn{padding:.7rem 1.4rem;border-radius:999px;background:var(--tinta);color:#fff;font-weight:700}
.btn.claro{background:var(--gris);color:var(--tinta)}

#toast{position:fixed;left:50%;bottom:1.5rem;transform:translate(-50%,150%);padding:.7rem 1.4rem;border-radius:999px;background:var(--tinta);color:#fff;font-weight:700;transition:transform .3s;z-index:50}
#toast.visible{transform:translate(-50%,0)}
footer{padding:2rem 1.25rem;text-align:center;font-size:.9rem;color:var(--suave);border-top:1px solid var(--linea)}

/* Responsive */
@media(max-width:760px){
  .detalle{grid-template-columns:1fr}
  .detalle .media{min-height:300px}
  .cuerpo{padding:1.4rem}
}
@media(max-width:560px){
  .barra{flex-wrap:wrap;gap:.6rem}
  .logo{font-size:1.3rem}
  .buscador{flex-basis:100%;order:2}
  .intro{padding-top:2rem}
  .filtros{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;padding:0 1rem .5rem;scrollbar-width:none}
  .filtros button{flex:none}
  .muro{column-width:150px;column-gap:.8rem}
  .info h2{font-size:1rem}
  .info p{display:none}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<header class="barra">
  <a class="logo" href="#">Lienzo</a>
  <form class="buscador" role="search">
    <label class="sr" for="buscar">Buscar inspiración</label>
    <input id="buscar" type="search" placeholder="Busca un estilo, una vibra o un color" autocomplete="off">
  </form>
</header>

<section class="intro">
  <h1>Encuentra tu próxima idea</h1>
  <p>Estilos, vibras, paletas y técnicas reunidos en un solo lugar para cuando el lienzo está en blanco.</p>
  <nav class="filtros" id="filtros" aria-label="Categorías"></nav>
</section>

<main class="muro" id="muro" aria-live="polite"></main>
<p class="vacio" id="vacio" hidden></p>

<dialog id="detalle" aria-labelledby="det-titulo"></dialog>
<div id="toast" role="status"></div>

<footer>
  <p>Proyecto escolar de diseño web. Las ilustraciones están hechas solo con CSS.</p>
</footer>

<script>
const CATS = { estilos: "Estilo", vibras: "Vibra", paletas: "Paleta", tecnicas: "Técnica" };
const FILTROS = [["todo","Todo"],["estilos","Estilos"],["vibras","Vibras"],["paletas","Paletas"],["tecnicas","Técnicas"],["guardados","Guardados"]];

const PINS = [
  { id:1,  cat:"estilos",  t:"Surrealismo onírico",   d:"Objetos que flotan, escalas imposibles y paisajes de sueño.", a:"a-surreal",  r:"3/4.4" },
  { id:2,  cat:"paletas",  t:"Océano profundo",       d:"Azules que van de la noche marina a la espuma.", c:["#0b2545","#13315c","#134074","#8da9c4","#eef4ed"], r:"1/1.15" },
  { id:3,  cat:"vibras",   t:"Nostalgia de verano",   d:"Luz dorada, tardes largas y recuerdos con grano de película.", a:"a-verano", r:"1/1.15" },
  { id:4,  cat:"tecnicas", t:"Acuarela húmeda",       d:"Moja el papel primero y deja que los colores se mezclen solos.", a:"a-acuarela", r:"3/4.4" },
  { id:5,  cat:"estilos",  t:"Minimalismo geométrico",d:"Pocas formas, mucho espacio y un solo punto focal.", a:"a-minimal", r:"1/1.15" },
  { id:6,  cat:"vibras",   t:"Cyberpunk nocturno",    d:"Neón sobre asfalto mojado, ciudades que nunca duermen.", a:"a-cyber", r:"3/4.4" },
  { id:7,  cat:"paletas",  t:"Dulce de frutas",       d:"Colores vivos y jugosos para ilustración infantil o pop.", c:["#ff6b6b","#ffa94d","#ffe066","#b2f2bb","#74c0fc","#b197fc"], r:"3/4.4" },
  { id:8,  cat:"tecnicas", t:"Grano de risografía",   d:"Dos o tres tintas, trama de puntos y capas que se cruzan.", a:"a-riso", r:"1/1.15" },
  { id:9,  cat:"estilos",  t:"Ilustración botánica",  d:"Hojas y flores con detalle, como un cuaderno de naturalista.", a:"a-botanico", r:"3/4.4" },
  { id:10, cat:"vibras",   t:"Cozy de invierno",      d:"Cobijas, té caliente y luz amarilla tras la ventana.", a:"a-cozy", r:"1/1.15" },
  { id:11, cat:"paletas",  t:"Tierra y barro",        d:"Marrones cálidos con un verde musgo que los equilibra.", c:["#6f4e37","#a47148","#d4a373","#e9d8a6","#606c38"], r:"1/1.15" },
  { id:12, cat:"estilos",  t:"Pop art",               d:"Colores primarios, contornos gruesos y trama de puntos.", a:"a-pop", r:"1/1.15" },
  { id:13, cat:"tecnicas", t:"Collage de papel",      d:"Recorta, rasga y superpone texturas para crear profundidad.", a:"a-collage", r:"3/4.4" },
  { id:14, cat:"vibras",   t:"Calma de bosque",       d:"Niebla, verdes apagados y una sensación de silencio.", a:"a-bosque", r:"3/4.4" },
  { id:15, cat:"paletas",  t:"Pastel con neón",       d:"Tonos suaves con un solo acento eléctrico que roba la atención.", c:["#ffd6e8","#d0f4de","#c8d7ff","#fff3b0","#ff3cac"], r:"1/1.15" },
  { id:16, cat:"estilos",  t:"Art nouveau",           d:"Líneas fluidas, flores estilizadas y marcos ornamentales.", a:"a-nouveau", r:"1/1.15" },
  { id:17, cat:"tecnicas", t:"Trazo de carboncillo",  d:"Contrastes fuertes, manchas con el dedo y gestos rápidos.", a:"a-carbon", r:"1/1.15" },
  { id:18, cat:"vibras",   t:"Atardecer retro",       d:"Sol rayado, rosas y morados de los años ochenta.", a:"a-retro", r:"1/1.15" }
];

const $ = (s) => document.querySelector(s);
const muro = $("#muro"), filtros = $("#filtros"), vacio = $("#vacio");
const dlg = $("#detalle"), toast = $("#toast");

// Estado y favoritos (se guardan en el navegador si está disponible)
const estado = { cat: "todo", q: "", guardados: new Set() };
try {
  const g = JSON.parse(localStorage.getItem("lienzo-guardados") || "[]");
  if (Array.isArray(g)) g.forEach((i) => estado.guardados.add(i));
} catch (e) { /* sin almacenamiento: los favoritos duran la sesión */ }

function persistir() {
  try { localStorage.setItem("lienzo-guardados", JSON.stringify([...estado.guardados])); } catch (e) {}
}

const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function visibles() {
  const q = norm(estado.q.trim());
  return PINS.filter((p) => {
    if (estado.cat === "guardados" && !estado.guardados.has(p.id)) return false;
    if (!["todo", "guardados"].includes(estado.cat) && p.cat !== estado.cat) return false;
    if (!q) return true;
    const texto = norm([p.t, p.d, CATS[p.cat], ...(p.c || [])].join(" "));
    return texto.includes(q);
  });
}

function mediaHTML(p, enDetalle) {
  const btnGuardar = `<button class="guardar" data-guardar="${p.id}" aria-pressed="${estado.guardados.has(p.id)}" aria-label="Guardar ${p.t}">${estado.guardados.has(p.id) ? "♥" : "♡"}</button>`;
  const estiloR = enDetalle ? "" : ` style="aspect-ratio:${p.r}"`;
  if (p.c) {
    const muestras = p.c.map((c) => `<button style="--c:${c}" data-copiar="${c}" aria-label="Copiar color ${c}"><b>${c.toUpperCase()}</b></button>`).join("");
    return `<div class="media"${estiloR}><div class="muestras">${muestras}</div>${btnGuardar}</div>`;
  }
  const abrir = enDetalle ? "" : `<button class="abrir" data-abrir="${p.id}" aria-label="Ver ${p.t}"></button>`;
  return `<div class="media"${estiloR}><div class="arte ${p.a}"></div>${abrir}${btnGuardar}</div>`;
}

function render() {
  const lista = visibles();
  muro.innerHTML = lista.map((p) => `
    <article class="pin">
      ${mediaHTML(p, false)}
      <div class="info">
        <h2><button data-abrir="${p.id}">${p.t}</button></h2>
        <p>${p.d}</p>
        <span class="etiqueta">${CATS[p.cat]}</span>
      </div>
    </article>`).join("");

  vacio.hidden = lista.length > 0;
  if (!lista.length) {
    vacio.textContent = estado.cat === "guardados" && !estado.q
      ? "Aún no guardas nada. Toca el corazón de un pin para verlo aquí."
      : "No encontramos nada con esa búsqueda. Prueba con otra palabra o un color.";
  }
  renderFiltros();
}

function renderFiltros() {
  filtros.innerHTML = FILTROS.map(([id, nombre]) => {
    const extra = id === "guardados" && estado.guardados.size ? ` (${estado.guardados.size})` : "";
    return `<button data-cat="${id}" aria-pressed="${estado.cat === id}">${nombre}${extra}</button>`;
  }).join("");
}

function aviso(msg) {
  toast.textContent = msg;
  toast.classList.add("visible");
  clearTimeout(aviso.t);
  aviso.t = setTimeout(() => toast.classList.remove("visible"), 1800);
}

function copiar(hex) {
  const ok = () => aviso("Color copiado: " + hex.toUpperCase());
  const respaldo = () => {
    const ta = document.createElement("textarea");
    ta.value = hex; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); ok(); } catch (e) { aviso("No se pudo copiar " + hex.toUpperCase()); }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(hex).then(ok, respaldo);
  else respaldo();
}

function alternarGuardado(id) {
  const p = PINS.find((x) => x.id === id);
  if (estado.guardados.has(id)) { estado.guardados.delete(id); aviso("Quitado de guardados"); }
  else { estado.guardados.add(id); aviso("Guardado: " + p.t); }
  persistir();
  render();
  if (dlg.open) abrirDetalle(id);
}

function abrirDetalle(id) {
  const p = PINS.find((x) => x.id === id);
  const guardado = estado.guardados.has(id);
  dlg.innerHTML = `
    <div class="detalle">
      ${mediaHTML(p, true)}
      <div class="cuerpo">
        <span class="etiqueta" style="align-self:flex-start">${CATS[p.cat]}</span>
        <h2 id="det-titulo">${p.t}</h2>
        <p>${p.d}</p>
        ${p.c ? "<p>Toca un color para copiar su código.</p>" : ""}
        <div class="fila">
          <button class="btn" data-guardar="${p.id}">${guardado ? "Quitar de guardados" : "Guardar idea"}</button>
          <button class="btn claro" data-cerrar>Cerrar</button>
        </div>
      </div>
    </div>`;
  if (!dlg.open) dlg.showModal();
}

// Eventos (delegación)
filtros.addEventListener("click", (e) => {
  const b = e.target.closest("[data-cat]");
  if (b) { estado.cat = b.dataset.cat; render(); }
});

document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-guardar]");
  if (g) return alternarGuardado(Number(g.dataset.guardar));
  const c = e.target.closest("[data-copiar]");
  if (c) return copiar(c.dataset.copiar);
  const a = e.target.closest("[data-abrir]");
  if (a) return abrirDetalle(Number(a.dataset.abrir));
  if (e.target.closest("[data-cerrar]") || e.target === dlg) dlg.close();
});

$("#buscar").addEventListener("input", (e) => { estado.q = e.target.value; render(); });
$(".buscador").addEventListener("submit", (e) => e.preventDefault());

render();
</script>
</body>
</html>
